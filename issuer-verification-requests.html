<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verification Requests | VerifiedDoc</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>body { font-family: Poppins, sans-serif; }</style>
</head>
<body class="font-sans bg-[#fafbfd] min-h-screen flex">
  <aside class="w-64 bg-[#1c2d5a] text-white flex flex-col shrink-0 min-h-screen">
    <div class="px-6 py-6 border-b border-slate-700/40"><img src="./Assets/logo.svg" alt="Logo" /></div>
    <nav class="flex-1 px-3 py-4 space-y-1 text-xs font-medium">
      <a href="dashboard-issuing-organization.html" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-slate-300 hover:bg-slate-700/30">Dashboard</a>
      <a href="issuer-issue-credential.html" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-slate-300 hover:bg-slate-700/30">Issue Credential</a>
      <a href="issuer-verification-requests.html" class="flex items-center gap-3 px-3 py-2.5 rounded-md bg-[#3b4e7a] text-white font-semibold">Verification Requests</a>
      <a href="institution-portal.html" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-slate-300 hover:bg-slate-700/30">Institutional Portal</a>
      <a href="src/prototype-settings-creHolder.html" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-slate-300 hover:bg-slate-700/30">Account Settings</a>
    </nav>
  </aside>

  <main class="flex-1 p-8 max-w-4xl">
    <h1 class="text-2xl font-bold text-slate-900">Verification Requests</h1>
    <p class="text-xs text-slate-400 mt-1 mb-6">Approve or reject incoming verification requests</p>
    <p id="error" class="hidden text-red-600 text-xs font-medium mb-3"></p>
    <div id="request-list" class="bg-white rounded-xl border border-slate-200 divide-y divide-slate-100">
      <p class="p-5 text-slate-400 text-sm">Loading...</p>
    </div>
  </main>

  <script src="./js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const {
        requireAuth,
        getOrganizationId,
        getOrganizationVerificationRequests,
        reviewOrganizationVerificationRequest,
        clearAuthSession,
      } = window.VerifiedDocAuth;

      if (!requireAuth("hero.html")) return;
      const list = document.getElementById("request-list");
      const errorEl = document.getElementById("error");

      if (!getOrganizationId()) {
        errorEl.textContent = "No organization linked to this account.";
        errorEl.classList.remove("hidden");
        list.innerHTML = "";
        return;
      }

      function escapeHtml(v) {
        return String(v ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      function formatRelative(iso) {
        if (!iso) return "";
        const mins = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
        if (mins < 60) return `${Math.max(mins, 1)} min ago`;
        const hours = Math.floor(mins / 60);
        if (hours < 24) return `${hours}h ago`;
        return `${Math.floor(hours / 24)}d ago`;
      }

      async function load() {
        try {
          const res = await getOrganizationVerificationRequests({ page: 1, limit: 50 });
          const items = res?.data || [];
          if (!items.length) {
            list.innerHTML = '<p class="p-5 text-slate-400 text-sm">No verification requests.</p>';
            return;
          }
          list.innerHTML = items.map((item) => {
            const title = item.credential?.title || "Credential";
            const requester = item.requestedBy?.fullName || item.requestedBy?.firstName || "Requester";
            const pending = String(item.status).toUpperCase() === "PENDING";
            return `<div class="p-4 px-5 flex items-center justify-between gap-4">
              <div>
                <p class="text-xs text-slate-700"><span class="font-bold text-slate-900">${escapeHtml(requester)}</span> requests verification of ${escapeHtml(title)}</p>
                <p class="text-[11px] text-slate-400 mt-0.5">${escapeHtml(item.status)} · ${escapeHtml(formatRelative(item.createdAt))}</p>
              </div>
              ${pending ? `<div class="flex items-center gap-2">
                <button data-id="${escapeHtml(item.id)}" data-decision="APPROVE" class="review-btn px-3 py-1 rounded text-[11px] font-medium bg-emerald-100/70 text-emerald-800">Approve</button>
                <button data-id="${escapeHtml(item.id)}" data-decision="REJECT" class="review-btn px-3 py-1 rounded text-[11px] font-medium bg-rose-100/70 text-rose-700">Reject</button>
              </div>` : ""}
            </div>`;
          }).join("");

          list.querySelectorAll(".review-btn").forEach((btn) => {
            btn.addEventListener("click", async () => {
              btn.disabled = true;
              try {
                await reviewOrganizationVerificationRequest(btn.dataset.id, {
                  decision: btn.dataset.decision,
                });
                await load();
              } catch (err) {
                errorEl.textContent = err.message;
                errorEl.classList.remove("hidden");
                btn.disabled = false;
              }
            });
          });
        } catch (err) {
          errorEl.textContent = err.message || "Failed to load requests";
          errorEl.classList.remove("hidden");
          list.innerHTML = "";
          if (err.status === 401) {
            clearAuthSession();
            window.location.href = "hero.html";
          }
        }
      }

      load();
    });
  </script>
</body>
</html>
