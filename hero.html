<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hero - Log In</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Google Fonts: Inter / Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Poppins', 'sans-serif'],
          },
          colors: {
            navy: {
              800: '#1b365d',
              900: '#1e3a60',
              hover: '#152b48',
            },
            gold: {
              500: '#b8860b',
              600: '#a37508',
            },
            cardBg: '#f8fafc',
            iconBg: '#e0f2fe',
            tealIcon: '#008080',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-white text-gray-700 min-h-screen font-sans flex items-center justify-center p-4">

  <div class="w-full max-w-6xl bg-white rounded-xl flex flex-col md:flex-row overflow-hidden my-auto min-h-[650px]">
    
    <!-- Left Section: Branding & Illustration -->
    <div class="w-full md:w-1/2 p-8 md:p-12 flex flex-col justify-between items-center text-center">
      <!-- Logo Header -->
      <div class="w-full flex justify-start mb-10 -mt-14 ">
        <img src="./Assets/transparentLogo.svg" alt="VerifiedDoc Logo" class="w-40 h-auto">
      </div>

      <!-- Hero Graphic Container -->
      <div class="my-auto w-full max-w-sm flex justify-center py-4">
        <img src="./Assets/loginImage.svg" alt="Login Hero Graphic" class="w-full h-auto">
      </div>

      <!-- Left Footer Text -->
      <div class="mt-4">
        <p class="text-base font-semibold text-gray-400">
          <span class="text-gold-500 font-bold">Secure</span>, Fast, Reliable
        </p>
        <h3 class="text-lg font-bold text-gray-500 mt-1">
          Employer Certificate Verification Made <span class="text-gold-500">Simple</span>
        </h3>
      </div>
    </div>

    <!-- Right Section: Login Form -->
    <div class="w-full md:w-1/2 p-8 md:p-12 flex flex-col justify-center">
      
      <div class="max-w-md mx-auto w-full">
        <!-- Main Heading -->
        <h1 class="text-3xl font-bold text-navy-900 mb-1">Log in</h1>
        <p class="text-sm text-gray-400 mb-6 font-medium">
          Access Your Account by Selecting your Role
        </p>

        <!-- Credentials Form Wrap -->
        <form id="login-form" class="space-y-4">
          <!-- Role Selection Area -->
          <div id="role-container" class="space-y-3 mb-6">
            
            <div class="grid grid-cols-2 gap-3">
              <!-- Role 1: Credential Holder -->
              <label class="role-card relative flex items-center p-3 rounded-lg border border-gray-200 cursor-pointer hover:border-teal-600 transition-all bg-white" data-role="holder">
                <div class="w-10 h-10 rounded-full bg-teal-50 flex items-center justify-center text-teal-700 mr-3 flex-shrink-0">
                  <i class="fa-solid fa-user text-lg"></i>
                </div>
                <div class="grow pr-4">
                  <h4 class="text-xs font-bold text-gray-800 leading-tight">Credential Holder</h4>
                  <p class="text-[10px] text-gray-400 leading-tight mt-0.5">Manage and share your documents</p>
                </div>
                <input type="radio" name="role" value="holder" class="sr-only" checked />
                <div class="radio-indicator w-3.5 h-3.5 rounded-full border border-gray-300 flex items-center justify-center flex-shrink-0">
                  <div class="dot w-2 h-2 rounded-full bg-teal-700 hidden"></div>
                </div>
              </label>

              <!-- Role 2: Verifier -->
              <label class="role-card relative flex items-center p-3 rounded-lg border border-gray-200 cursor-pointer hover:border-teal-600 transition-all bg-white" data-role="verifier">
                <div class="w-10 h-10 rounded-full bg-teal-50 flex items-center justify-center text-teal-700 mr-3 flex-shrink-0">
                  <img src="./Assets/verifier-icon.png" alt="Verifier Icon" class="w-5 h-5">
                </div>
                <div class="flex-grow pr-4">
                  <h4 class="text-xs font-bold text-gray-800 leading-tight">Verifier</h4>
                  <p class="text-[10px] text-gray-400 leading-tight mt-0.5">verify certificate and manage verification requests</p>
                </div>
                <input type="radio" name="role" value="verifier" class="sr-only" />
                <div class="radio-indicator w-3.5 h-3.5 rounded-full border border-gray-300 flex items-center justify-center flex-shrink-0">
                  <div class="dot w-2 h-2 rounded-full bg-teal-700 hidden"></div>
                </div>
              </label>
            </div>

            <!-- Role 3: Issuing Organisation (Centered Row) -->
            <div class="flex justify-center">
              <label class="role-card w-3/4 relative flex items-center p-3 rounded-lg border border-gray-200 cursor-pointer hover:border-teal-600 transition-all bg-white" data-role="issuer">
                <div class="w-10 h-10 rounded-full bg-teal-50 flex items-center justify-center text-teal-700 mr-3 flex-shrink-0">
                  <i class="fa-solid fa-graduation-cap text-lg"></i>
                </div>
                <div class="flex-grow pr-4">
                  <h4 class="text-xs font-bold text-gray-800 leading-tight">Issuing Organisation</h4>
                  <p class="text-[10px] text-gray-400 leading-tight mt-0.5">Issue and verify certificate for your institution</p>
                </div>
                <input type="radio" name="role" value="issuer" class="sr-only" />
                <div class="radio-indicator w-3.5 h-3.5 rounded-full border border-gray-300 flex items-center justify-center flex-shrink-0">
                  <div class="dot w-2 h-2 rounded-full bg-teal-700 hidden"></div>
                </div>
              </label>
            </div>

          </div>

          <!-- Admin Prompt -->
          <div class="text-center md:text-left mb-5">
            <p class="text-sm font-medium text-gray-500">
              Are you an Admin? 
              <a href="admin-login.html" id="admin-link" class="text-gold-500 font-bold hover:underline">Click here</a>
            </p>
          </div>

          <!-- Email Field -->
          <div>
            <label for="email" class="block text-xs font-semibold text-gray-700 mb-1">Email Address</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-teal-700">
                <i class="fa-regular fa-envelope text-xs"></i>
              </div>
              <input 
                type="email" 
                id="email" 
                required
                placeholder="Enter Your email Address" 
                class="w-full pl-9 pr-3 py-2 text-xs border border-gray-200 rounded-md focus:outline-none focus:ring-1 focus:ring-teal-600 focus:border-teal-600 placeholder-gray-300" 
              />
            </div>
          </div>

          <!-- Password Field -->
          <div>
            <label for="password" class="block text-xs font-semibold text-gray-700 mb-1">Password</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-teal-700">
                <i class="fa-solid fa-lock text-xs"></i>
              </div>
              <input 
                type="password" 
                id="password" 
                required
                placeholder="Enter Your Password" 
                class="w-full pl-9 pr-9 py-2 text-xs border border-gray-200 rounded-md focus:outline-none focus:ring-1 focus:ring-teal-600 focus:border-teal-600 placeholder-gray-300" 
              />
              <button type="button" id="toggle-password" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600">
                <i class="fa-regular fa-eye text-xs"></i>
              </button>
            </div>
          </div>

          <!-- Remember Me & Forgot Password -->
          <div class="flex items-center justify-between text-xs pt-1">
            <label class="flex items-center space-x-2 cursor-pointer">
              <input type="checkbox" id="remember-me" checked class="hidden peer" />
              <div class="w-4 h-4 border border-teal-700 rounded flex items-center justify-center bg-white peer-checked:bg-teal-700 text-white transition-colors">
                <i class="fa-solid fa-check text-[10px]"></i>
              </div>
              <span class="font-bold text-gray-700">Remember Me</span>
            </label>

            <a href="src/prototype-forgetPasswd.html" class="font-bold text-gold-500 hover:underline">Forget Password?</a>
          </div>

          <p id="login-error" class="hidden text-xs font-semibold text-red-600 text-center"></p>
          <p id="login-success" class="hidden text-xs font-semibold text-teal-700 text-center bg-teal-50 border border-teal-100 rounded-md px-3 py-2"></p>

          <!-- Submit Button -->
          <div class="pt-2">
            <button 
              type="submit"
              class="w-full bg-navy-900 hover:bg-navy-hover text-white font-semibold py-2.5 rounded-md transition duration-200 text-sm tracking-wide shadow-sm"
            >
              Log In
            </button>
          </div>
        </form>

        <!-- Footer Callout -->
        <div class="mt-6 text-center">
          <p class="text-xs font-semibold text-gray-500">
            Dont have an account? 
            <a href="signup.html" class="text-gold-500 font-bold hover:underline">Create Account</a>
          </p>
        </div>

      </div>

    </div>

  </div>

  <!-- Component Logic -->
  <script src="./js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const { loginAccount, saveAuthSession, redirectForRole } = window.VerifiedDocAuth;

      const roleCards = document.querySelectorAll('.role-card');
      const passwordInput = document.getElementById('password');
      const togglePasswordBtn = document.getElementById('toggle-password');
      const loginForm = document.getElementById('login-form');
      const submitBtn = loginForm.querySelector('button[type="submit"]');
      const formError = document.getElementById('login-error');
      const formSuccess = document.getElementById('login-success');

      function setError(message) {
        formSuccess.classList.add('hidden');
        formSuccess.textContent = '';
        if (!message) {
          formError.classList.add('hidden');
          formError.textContent = '';
          return;
        }
        formError.textContent = message;
        formError.classList.remove('hidden');
      }

      function showSuccess(message) {
        formError.classList.add('hidden');
        formError.textContent = '';
        formSuccess.textContent = message;
        formSuccess.classList.remove('hidden');
      }

      updateRoleSelection();

      roleCards.forEach(card => {
        card.addEventListener('click', () => {
          roleCards.forEach(c => {
            c.querySelector('input[type="radio"]').checked = false;
          });
          card.querySelector('input[type="radio"]').checked = true;
          updateRoleSelection();
        });
      });

      function updateRoleSelection() {
        roleCards.forEach(card => {
          const radio = card.querySelector('input[type="radio"]');
          const indicator = card.querySelector('.radio-indicator');
          const dot = card.querySelector('.dot');

          if (radio.checked) {
            card.classList.add('border-teal-700', 'ring-1', 'ring-teal-700');
            card.classList.remove('border-gray-200');
            indicator.classList.add('border-teal-700');
            indicator.classList.remove('border-gray-300');
            dot.classList.remove('hidden');
          } else {
            card.classList.remove('border-teal-700', 'ring-1', 'ring-teal-700');
            card.classList.add('border-gray-200');
            indicator.classList.remove('border-teal-700');
            indicator.classList.add('border-gray-300');
            dot.classList.add('hidden');
          }
        });
      }

      togglePasswordBtn.addEventListener('click', () => {
        const icon = togglePasswordBtn.querySelector('i');
        if (passwordInput.type === 'password') {
          passwordInput.type = 'text';
          icon.classList.remove('fa-eye');
          icon.classList.add('fa-eye-slash');
        } else {
          passwordInput.type = 'password';
          icon.classList.remove('fa-eye-slash');
          icon.classList.add('fa-eye');
        }
      });

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        setError('');

        const email = document.getElementById('email').value.trim();
        const password = passwordInput.value;

        submitBtn.disabled = true;
        submitBtn.textContent = 'Signing In...';

        try {
          const session = await loginAccount({ email, password });
          saveAuthSession(session);

          const firstName = session.user?.firstName || 'there';
          showSuccess(`Welcome back, ${firstName}! Redirecting to your dashboard...`);
          submitBtn.textContent = 'Success';

          setTimeout(() => {
            redirectForRole(session.user.role);
          }, 1500);
        } catch (err) {
          setError(err.message || 'Login failed. Check your email and password.');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Log In';
        }
      });
    });
  </script>

</body>
</html>
