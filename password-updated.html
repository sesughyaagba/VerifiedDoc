<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Updated</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Poppins Font Integration -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
        rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            navy: '#031530',
                            button: '#1E3A64',
                            shield: '#22C55E',
                            shieldDark: '#15803D',
                            textDark: '#021C3E',
                            textMuted: '#64748B',
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="font-sans antialiased bg-white text-slate-800 min-h-screen">

    <div class="flex flex-col lg:flex-row min-h-screen w-full">

        <!-- LEFT SIDE: Dark Navy Hero / Branding Area -->
        <div
            class="lg:w-1/2 bg-[#021C3E] text-white flex flex-col justify-between p-8 lg:p-12 relative min-h-125 lg:min-h-screen">
            <!-- Top Logo -->
            <div class="absolute top-11.25 left-10.75 w-34.25 h-[43.68px] rotate-0 opacity-100">
                <img src="./Assets/logo.svg" alt="VerifiedDoc Logo" class="w-18 h-10">
            </div>

            <!-- Center Graphic & Message -->
            <div class="my-auto py-12 flex flex-col items-center text-center">
                <!-- 3D Envelope & Paper Plane Graphic -->
                <div class="relative w-64 h-64 mb-6 flex items-center justify-center">
                    <img src="./Assets/emailLogo.svg" alt="Email Logo">
                </div>

                <h2 class="text-2xl lg:text-3xl font-semibold tracking-tight text-white mb-1.5">Password Updated</h2>
                <p class="text-slate-400 text-xs font-normal">No need to worry</p>
            </div>

            <!-- Bottom Security Notice -->
            <div class="flex items-center justify-center space-x-3 pt-4">
                <div class="w-10 h-15 opacity-100">
                    <img src="./Assets/badge.svg" alt="Badge">
                </div>

                <div>
                    <h4 class="text-xs font-semibold text-white leading-tight">
                        Your Security is our priority
                    </h4>
                    <p class="text-[10px] text-slate-400 leading-normal mt-0.5 w-40">
                        The extra steps helps keep your account safe and secure
                    </p>
                </div>
            </div>

        </div>

        <!-- RIGHT SIDE: Confirmation Action Screen -->
        <div class="lg:w-1/2 bg-white flex flex-col justify-between p-8 lg:p-12 relative min-h-screen">

            <!-- Top Navigation -->
            <div>
                <button onclick="window.history.back()"
                    class="inline-flex items-center text-[#1E3A64] font-semibold text-base hover:opacity-80 transition-opacity">
                    <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path>
                    </svg>
                    Back
                </button>
            </div>

            <!-- Main Central Card Content -->
            <div class="my-auto py-8 max-w-md mx-auto w-full flex flex-col items-center text-center">

                <!-- Shield Vector Graphic -->
                <div class="relative w-52 h-52 mb-8 flex items-center justify-center">
                    <!-- Circular Light Green Background Accent -->
                    <div class="absolute inset-0 bg-emerald-50/70 rounded-full scale-100"></div>

                    <!-- Decorative Background Elements -->
                    <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                        <span class="absolute top-6 right-10 w-2.5 h-2.5 bg-emerald-400 rounded-full"></span>
                        <span class="absolute top-8 left-10 w-3 h-3 border-2 border-emerald-400 rounded-full"></span>
                        <span class="absolute left-8 top-28 w-2 h-2 bg-emerald-400 rounded-full"></span>
                        <span
                            class="absolute right-8 top-24 w-2.5 h-2.5 border-2 border-emerald-400 rounded-full"></span>
                        <span class="absolute bottom-12 right-12 w-2 h-2 bg-emerald-400 rounded-full"></span>

                        <svg class="absolute top-10 left-10 w-8 h-8 text-emerald-300 stroke-current" fill="none"
                            stroke-width="2" stroke-dasharray="3 3" viewBox="0 0 24 24">
                            <line x1="0" y1="24" x2="24" y2="0" />
                        </svg>
                        <svg class="absolute bottom-10 right-10 w-8 h-8 text-emerald-300 stroke-current" fill="none"
                            stroke-width="2" stroke-dasharray="3 3" viewBox="0 0 24 24">
                            <line x1="0" y1="24" x2="24" y2="0" />
                        </svg>
                    </div>

                    <!-- Central Shield Icon -->
                    <div class="relative z-10 w-32 h-36">
                        <svg class="w-full h-full drop-shadow-md" viewBox="0 0 100 120" fill="none">
                            <defs>
                                <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                                    <stop offset="50%" stop-color="#22C55E" />
                                    <stop offset="50%" stop-color="#15803D" />
                                </linearGradient>
                            </defs>
                            <path d="M50 0 L100 20 V60 C100 90 50 115 50 120 C50 115 0 90 0 60 V20 L50 0 Z"
                                fill="url(#shieldGrad)" />
                            <path d="M32 58 L45 71 L70 42" stroke="white" stroke-width="9" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                    </div>
                </div>

                <!-- Success Message -->
                <h1 class="text-2xl sm:text-3xl font-bold text-[#1E3A64] leading-tight mb-3 tracking-tight">
                    Password Updated<br />Successfully
                </h1>
                <p class="text-slate-500 text-sm leading-relaxed max-w-xs mb-8 font-normal">
                    Your password has been updated successfully. You can now sign in securely.
                </p>

                <!-- CTA Action Button -->
                <button id="signInBtn" type="button"
                    class="w-full max-w-xs bg-[#1E3A64] hover:bg-[#162C4C] active:scale-[0.99] text-white font-medium text-base py-3.5 px-6 rounded-lg transition-all shadow-md hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#1E3A64]">
                    Go to Sign In
                </button>

            </div>

            <!-- Bottom Footer Seal -->
            <div class="flex items-center justify-center space-x-2 pb-2">
                <svg class="w-5 h-6 text-slate-300 fill-current" viewBox="0 0 24 24">
                    <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z" />
                </svg>
                <span class="text-xs font-normal text-slate-400">Secure verification by Verified Doc</span>
            </div>

        </div>

    </div>

    <script>
        document.getElementById('signInBtn').addEventListener('click', function () {
            console.log('Redirecting to sign-in page...');
        });
    </script>
</body>

</html>
