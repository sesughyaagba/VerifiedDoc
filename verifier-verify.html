<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Credential | VerifiedDoc</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>body { font-family: Poppins, sans-serif; }</style>
</head>
<body class="bg-[#F8FAFC] min-h-screen flex">
  <aside class="w-64 bg-[#21355E] text-white flex flex-col p-4 shrink-0 min-h-screen">
    <div class="px-2 py-3 mb-6"><img src="./Assets/logo.svg" alt="Logo" /></div>
    <nav class="space-y-1.5">
      <a href="dashboard-verifier.html" class="flex items-center space-x-3 px-3.5 py-2.5 rounded-lg text-slate-300 hover:bg-white/5 text-sm">Dashboard</a>
      <a href="verifier-verify.html" class="flex items-center space-x-3 px-3.5 py-2.5 rounded-lg bg-white/15 text-white font-semibold text-sm">Verify a Credential</a>
      <a href="dashboard-verifier.html#history" class="flex items-center space-x-3 px-3.5 py-2.5 rounded-lg text-slate-300 hover:bg-white/5 text-sm">Verification History</a>
      <a href="verifier-saved-orgs.html" class="flex items-center space-x-3 px-3.5 py-2.5 rounded-lg text-slate-300 hover:bg-white/5 text-sm">Saved Organizations</a>
      <a href="src/prototype-settings-creHolder.html" class="flex items-center space-x-3 px-3.5 py-2.5 rounded-lg text-slate-300 hover:bg-white/5 text-sm">Account Settings</a>
    </nav>
  </aside>

  <main class="flex-1 p-8 max-w-3xl">
    <h1 class="text-2xl font-bold text-slate-900">Verify a Credential</h1>
    <p class="text-sm text-slate-500 mt-1 mb-6">Authenticate with a share token, QR token, or public ID</p>
    <p id="error" class="hidden text-red-600 text-xs font-medium mb-4"></p>

    <form id="verify-form" class="bg-white border border-slate-200 rounded-xl p-6 space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1.5">Method</label>
        <select id="method" class="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm">
          <option value="SHARE_TOKEN">Share Token</option>
          <option value="QR">QR Token</option>
          <option value="PUBLIC_ID">Public ID</option>
        </select>
      </div>
      <div>
        <label id="value-label" class="block text-xs font-semibold text-slate-700 mb-1.5">Token</label>
        <input id="value" required type="text" placeholder="Paste token or public ID" class="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm" />
      </div>
      <button type="submit" id="submit-btn" class="bg-[#21355E] text-white text-sm font-medium px-5 py-2.5 rounded-lg hover:opacity-90">Verify</button>
    </form>

    <div id="result" class="hidden mt-6 bg-white border border-slate-200 rounded-xl p-6">
      <p class="text-xs uppercase tracking-wide text-slate-400 font-semibold">Result</p>
      <p id="result-status" class="text-2xl font-bold text-[#21355E] mt-2">—</p>
      <pre id="result-body" class="mt-4 text-xs text-slate-600 whitespace-pre-wrap break-all bg-slate-50 rounded-lg p-4"></pre>
    </div>
  </main>

  <script src="./js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const { requireAuth, performVerification, clearAuthSession } = window.VerifiedDocAuth;
      if (!requireAuth("hero.html")) return;

      const methodEl = document.getElementById("method");
      const valueLabel = document.getElementById("value-label");
      const valueEl = document.getElementById("value");
      const errorEl = document.getElementById("error");
      const resultEl = document.getElementById("result");
      const submitBtn = document.getElementById("submit-btn");

      methodEl.addEventListener("change", () => {
        valueLabel.textContent = methodEl.value === "PUBLIC_ID" ? "Public ID" : "Token";
      });

      document.getElementById("verify-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        errorEl.classList.add("hidden");
        resultEl.classList.add("hidden");
        submitBtn.disabled = true;
        submitBtn.textContent = "Verifying...";

        const method = methodEl.value;
        const value = valueEl.value.trim();
        const payload =
          method === "PUBLIC_ID"
            ? { method, publicId: value }
            : { method, token: value };

        try {
          const data = await performVerification(payload);
          document.getElementById("result-status").textContent =
            data?.result || data?.verification?.result || data?.outcome || "Completed";
          document.getElementById("result-body").textContent = JSON.stringify(data, null, 2);
          resultEl.classList.remove("hidden");
        } catch (err) {
          errorEl.textContent = err.message || "Verification failed";
          errorEl.classList.remove("hidden");
          if (err.status === 401) {
            clearAuthSession();
            window.location.href = "hero.html";
          }
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "Verify";
        }
      });
    });
  </script>
</body>
</html>
