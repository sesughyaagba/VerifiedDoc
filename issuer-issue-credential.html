<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Issue Credential | VerifiedDoc</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>body { font-family: Poppins, sans-serif; }</style>
</head>
<body class="font-sans bg-[#fafbfd] min-h-screen flex">
  <aside class="w-64 bg-[#1c2d5a] text-white flex flex-col shrink-0 min-h-screen">
    <div class="px-6 py-6 border-b border-slate-700/40"><img src="./Assets/logo.svg" alt="Logo" /></div>
    <nav class="flex-1 px-3 py-4 space-y-1 text-xs font-medium">
      <a href="dashboard-issuing-organization.html" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-slate-300 hover:bg-slate-700/30">Dashboard</a>
      <a href="issuer-issue-credential.html" class="flex items-center gap-3 px-3 py-2.5 rounded-md bg-[#3b4e7a] text-white font-semibold">Issue Credential</a>
      <a href="issuer-verification-requests.html" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-slate-300 hover:bg-slate-700/30">Verification Requests</a>
      <a href="institution-portal.html" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-slate-300 hover:bg-slate-700/30">Institutional Portal</a>
      <a href="src/prototype-settings-creHolder.html" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-slate-300 hover:bg-slate-700/30">Account Settings</a>
    </nav>
  </aside>

  <main class="flex-1 p-8 max-w-3xl">
    <h1 class="text-2xl font-bold text-slate-900">Issue a Credential</h1>
    <p class="text-xs text-slate-400 mt-1 mb-6">Create a credential for a holder by email</p>
    <p id="error" class="hidden text-red-600 text-xs font-medium mb-3"></p>
    <p id="success" class="hidden text-emerald-600 text-xs font-medium mb-3"></p>

    <form id="issue-form" class="bg-white border border-slate-200 rounded-xl p-6 space-y-4">
      <div>
        <label class="block text-xs font-semibold mb-1">Holder Email</label>
        <input id="holderEmail" type="email" required class="w-full border border-slate-200 rounded-md px-3 py-2 text-sm" />
      </div>
      <div>
        <label class="block text-xs font-semibold mb-1">Title</label>
        <input id="title" type="text" required class="w-full border border-slate-200 rounded-md px-3 py-2 text-sm" />
      </div>
      <div>
        <label class="block text-xs font-semibold mb-1">Credential Type</label>
        <input id="credentialType" type="text" required placeholder="e.g. CERTIFICATE" class="w-full border border-slate-200 rounded-md px-3 py-2 text-sm" />
      </div>
      <div>
        <label class="block text-xs font-semibold mb-1">Reference No</label>
        <input id="referenceNo" type="text" required minlength="3" class="w-full border border-slate-200 rounded-md px-3 py-2 text-sm" />
      </div>
      <div>
        <label class="block text-xs font-semibold mb-1">Issued At</label>
        <input id="issuedAt" type="datetime-local" required class="w-full border border-slate-200 rounded-md px-3 py-2 text-sm" />
      </div>
      <div>
        <label class="block text-xs font-semibold mb-1">Expires At (optional)</label>
        <input id="expiresAt" type="datetime-local" class="w-full border border-slate-200 rounded-md px-3 py-2 text-sm" />
      </div>
      <div>
        <label class="block text-xs font-semibold mb-1">Description (optional)</label>
        <textarea id="description" rows="3" class="w-full border border-slate-200 rounded-md px-3 py-2 text-sm"></textarea>
      </div>
      <button id="submit-btn" type="submit" class="bg-[#19284d] text-white text-sm font-medium px-4 py-2.5 rounded-md">Issue Credential</button>
    </form>
  </main>

  <script src="./js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const {
        requireAuth,
        getOrganizationId,
        issueCredential,
        clearAuthSession,
      } = window.VerifiedDocAuth;

      if (!requireAuth("hero.html")) return;
      if (!getOrganizationId()) {
        document.getElementById("error").textContent =
          "No organization linked to this account. Accept an org invitation or apply as an institution first.";
        document.getElementById("error").classList.remove("hidden");
        document.getElementById("issue-form").querySelectorAll("input,textarea,button").forEach((el) => {
          el.disabled = true;
        });
        return;
      }

      document.getElementById("issuedAt").value = new Date().toISOString().slice(0, 16);

      document.getElementById("issue-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const err = document.getElementById("error");
        const ok = document.getElementById("success");
        const btn = document.getElementById("submit-btn");
        err.classList.add("hidden");
        ok.classList.add("hidden");
        btn.disabled = true;
        btn.textContent = "Issuing...";

        const payload = {
          holderEmail: document.getElementById("holderEmail").value.trim(),
          title: document.getElementById("title").value.trim(),
          credentialType: document.getElementById("credentialType").value.trim(),
          referenceNo: document.getElementById("referenceNo").value.trim(),
          issuedAt: new Date(document.getElementById("issuedAt").value).toISOString(),
          description: document.getElementById("description").value.trim() || undefined,
        };
        const expires = document.getElementById("expiresAt").value;
        if (expires) payload.expiresAt = new Date(expires).toISOString();

        try {
          const res = await issueCredential(payload);
          ok.textContent = `Issued successfully${res?.credential?.publicId ? `: ${res.credential.publicId}` : ""}`;
          ok.classList.remove("hidden");
          e.target.reset();
          document.getElementById("issuedAt").value = new Date().toISOString().slice(0, 16);
        } catch (error) {
          err.textContent = error.message || "Failed to issue credential";
          err.classList.remove("hidden");
          if (error.status === 401) {
            clearAuthSession();
            window.location.href = "hero.html";
          }
        } finally {
          btn.disabled = false;
          btn.textContent = "Issue Credential";
        }
      });
    });
  </script>
</body>
</html>
