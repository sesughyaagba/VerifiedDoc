<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VerifiedDoc | Verify Your Code</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { poppins: ["Poppins", "sans-serif"] },
            colors: {
              navy: "#021C3E",
              teal: "#12677F",
              gold: "#C98A2C",
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Poppins", sans-serif;
      }
      .otp-box:focus {
        outline: none;
        border-color: #12677f;
        box-shadow: 0 0 0 3px rgba(18, 103, 127, 0.15);
      }
      .resend-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body class="bg-white min-h-screen flex flex-col">
    <div
      class="w-full max-w-[420px] mx-auto flex flex-col flex-1 px-6 pt-8 pb-6"
    >
      <!-- Desktop only: back button -->
      <button
        class="hidden md:flex items-center gap-1 text-navy font-semibold text-sm self-start mb-10"
      >
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        Back
      </button>

      <!-- Desktop only: padlock icon -->
      <div class="hidden md:flex justify-center mb-6">
        <img src="assets/padlock.svg" alt="Padlock" class="w-12 h-12" />
      </div>

      <!-- Mobile only: trust header (reused from OTP-sent screen) -->
      <div class="flex md:hidden items-start gap-3 mt-2 mb-10">
        <img
          src="assets/shield-navy.svg"
          alt="Security shield"
          class="w-8 h-9 flex-shrink-0 mt-0.5"
        />
        <div>
          <p class="font-semibold text-navy text-sm">
            Your Security is our priority
          </p>
          <p class="text-xs text-slate-500 mt-1 leading-snug">
            The extra steps helps keep your account safe and secure
          </p>
        </div>
      </div>

      <!-- Shared: heading + subtext -->
      <h1 class="text-navy font-bold text-2xl text-center">Verify Your Code</h1>
      <p class="text-slate-500 text-sm text-center mt-2">
        Enter the 6 digit code sent to
      </p>
      <p class="text-gold text-sm font-medium text-center mt-1">
        adenijiad***.com
      </p>

      <!-- OTP inputs -->
      <div class="flex justify-center gap-2 sm:gap-3 mt-8" id="otp-inputs">
        <input
          type="text"
          inputmode="numeric"
          maxlength="1"
          class="otp-box w-11 h-11 sm:w-12 sm:h-12 text-center text-lg font-semibold text-navy border border-slate-300 rounded-lg transition"
        />
        <input
          type="text"
          inputmode="numeric"
          maxlength="1"
          class="otp-box w-11 h-11 sm:w-12 sm:h-12 text-center text-lg font-semibold text-navy border border-slate-300 rounded-lg transition"
        />
        <input
          type="text"
          inputmode="numeric"
          maxlength="1"
          class="otp-box w-11 h-11 sm:w-12 sm:h-12 text-center text-lg font-semibold text-navy border border-slate-300 rounded-lg transition"
        />
        <input
          type="text"
          inputmode="numeric"
          maxlength="1"
          class="otp-box w-11 h-11 sm:w-12 sm:h-12 text-center text-lg font-semibold text-navy border border-slate-300 rounded-lg transition"
        />
        <input
          type="text"
          inputmode="numeric"
          maxlength="1"
          class="otp-box w-11 h-11 sm:w-12 sm:h-12 text-center text-lg font-semibold text-navy border border-slate-300 rounded-lg transition"
        />
        <input
          type="text"
          inputmode="numeric"
          maxlength="1"
          class="otp-box w-11 h-11 sm:w-12 sm:h-12 text-center text-lg font-semibold text-navy border border-slate-300 rounded-lg transition"
        />
      </div>

      <!-- Timer -->
      <p class="text-center text-sm text-slate-500 mt-6">
        Code expires in
        <span id="timer" class="text-gold font-semibold">03:25</span>
      </p>

      <!-- Resend -->
      <p class="text-center text-sm text-slate-600 mt-3">
        Didn't receive the code?
        <button
          id="resend-btn"
          class="resend-btn text-gold font-semibold"
          disabled
        >
          Resend code
        </button>
      </p>

      <!-- Verify button -->
      <button
        id="verify-btn"
        class="bg-navy text-white font-semibold text-sm rounded-lg py-3.5 mt-8 hover:opacity-90 active:opacity-80 transition"
      >
        Verify Code
      </button>
      <p id="error-msg" class="hidden text-center text-xs text-red-500 mt-2">
        Please enter all 6 digits.
      </p>

      <!-- Spacer -->
      <div class="flex-1"></div>

      <!-- Footer -->
      <div class="flex items-center justify-center gap-2 pt-8">
        <img
          src="assets/shield-gray.svg"
          alt="Verified shield"
          class="w-4 h-[18px] fill-gray-700"
        />
        <p class="text-xs text-slate-400">
          Secure verification by Verified Doc
        </p>
      </div>
    </div>

    <script>
      // --- OTP auto-advance behavior ---
      const inputs = Array.from(document.querySelectorAll("#otp-inputs input"));

      inputs.forEach((input, idx) => {
        input.addEventListener("input", (e) => {
          const val = e.target.value.replace(/[^0-9]/g, "");
          e.target.value = val;
          if (val && idx < inputs.length - 1) inputs[idx + 1].focus();
        });

        input.addEventListener("keydown", (e) => {
          if (e.key === "Backspace" && !e.target.value && idx > 0) {
            inputs[idx - 1].focus();
          }
        });

        input.addEventListener("paste", (e) => {
          e.preventDefault();
          const pasted = (e.clipboardData.getData("text") || "")
            .replace(/[^0-9]/g, "")
            .slice(0, inputs.length);
          pasted.split("").forEach((char, i) => {
            if (inputs[i]) inputs[i].value = char;
          });
          const next = inputs[Math.min(pasted.length, inputs.length - 1)];
          if (next) next.focus();
        });
      });

      // --- Countdown timer ---
      const timerEl = document.getElementById("timer");
      const resendBtn = document.getElementById("resend-btn");
      let secondsLeft = 205; // 03:25
      let timerInterval = null;

      function formatTime(s) {
        const m = Math.floor(s / 60)
          .toString()
          .padStart(2, "0");
        const sec = (s % 60).toString().padStart(2, "0");
        return `${m}:${sec}`;
      }

      function startTimer() {
        clearInterval(timerInterval);
        secondsLeft = 205;
        timerEl.textContent = formatTime(secondsLeft);
        resendBtn.disabled = true;

        timerInterval = setInterval(() => {
          secondsLeft--;
          if (secondsLeft <= 0) {
            clearInterval(timerInterval);
            timerEl.textContent = "Expired";
            resendBtn.disabled = false;
          } else {
            timerEl.textContent = formatTime(secondsLeft);
          }
        }, 1000);
      }

      resendBtn.addEventListener("click", () => {
        if (resendBtn.disabled) return;
        inputs.forEach((i) => (i.value = ""));
        inputs[0].focus();
        startTimer();
        // Hook your resend-code API call here.
      });

      startTimer();

      // --- Verify button ---
      const verifyBtn = document.getElementById("verify-btn");
      const errorMsg = document.getElementById("error-msg");

      verifyBtn.addEventListener("click", () => {
        const code = inputs.map((i) => i.value).join("");
        if (code.length < 6) {
          errorMsg.classList.remove("hidden");
          return;
        }
        errorMsg.classList.add("hidden");
        // Hook your verify-code API call here with `code`.
        console.log("Verifying code:", code);
      });
    </script>
  </body>
</html>
