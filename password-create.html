<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VerifiedDoc - Create New Password</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brandDark: '#0A1D37',
                        brandBlue: '#214070',
                        brandTextDark: '#1E293B',
                        brandMuted: '#8E9BAE',
                        brandGreen: '#2E7D32',
                        brandGold: '#A38148',
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-white font-sans text-slate-800 antialiased min-h-screen flex">

    <div class="flex flex-col lg:flex-row w-full min-h-screen">

        <!-- Left Sidebar Section -->
        <div
            class="w-full lg:w-[42%] bg-[#021C3E] text-white flex flex-col justify-between p-8 lg:p-12 min-h-[500px] lg:min-h-screen relative overflow-hidden">

            <!-- Logo Header -->
            <div class="absolute top-11.25 left-10.75 w-34.25 h-[43.68px] rotate-0 opacity-100">
                <img src="./Assets/logo.svg" alt="VerifiedDoc Logo" class="w-18 h-10">
            </div>

            <!-- Center Hero Graphic & Text -->
            <div class="flex flex-col items-center justify-center text-center my-auto z-10 py-8">
                <div class="relative w-64 h-64 mb-6 flex items-center justify-center">
                    <img src="./Assets/emailLogo.svg" alt="Email Logo">
                </div>

                <h2 class="text-2xl font-semibold mb-2">Create a New Password</h2>
                <p class="text-slate-400 text-sm">No need to worry</p>
            </div>

            <!-- Security Footer Banner -->
            <div class="flex items-center justify-center space-x-3 pt-4">
                <div class="w-10 h-15 opacity-100">
                    <img src="./Assets/badge.svg" alt="Badge">
                </div>

                <div>
                    <h4 class="text-xs font-semibold text-white leading-tight">
                        Your Security is our priority
                    </h4>
                    <p class="text-[10px] text-slate-400 leading-normal mt-0.5 w-40">
                        The extra steps helps keep your account safe and secure
                    </p>
                </div>
            </div>
        </div>

        <!-- Right Form Section -->
        <div class="w-full lg:w-[58%] flex flex-col justify-between p-8 lg:p-16 bg-white relative">

            <!-- Back Navigation Button -->
            <div class="w-full">
                <button id="backBtn"
                    class="inline-flex items-center text-[#1E3A8A] font-semibold text-sm hover:opacity-80 transition-opacity">
                    <svg class="w-4 h-4 mr-1 stroke-[3]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path>
                    </svg>
                    Back
                </button>
            </div>

            <!-- Password Reset Form Content -->
            <div class="max-w-md w-full mx-auto my-auto py-12">
                <div class="text-center mb-8">
                    <h1 class="text-2xl lg:text-3xl font-bold text-[#1E293B] mb-2">Create New Password</h1>
                    <p class="text-slate-400 text-sm leading-relaxed max-w-xs mx-auto">
                        Your new password must be strong and easy for you to remember.
                    </p>
                </div>

                <form id="passwordForm" class="space-y-6" onsubmit="event.preventDefault();">

                    <!-- New Password Input Group -->
                    <div>
                        <label for="newPassword" class="block text-sm font-semibold text-[#1E293B] mb-2">New
                            Password</label>
                        <div class="relative">
                            <input type="password" id="newPassword" value="............"
                                class="w-full px-4 py-3 text-slate-700 bg-white border border-slate-400 rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-600 focus:border-transparent tracking-widest text-lg transition-all"
                                required>
                            <button type="button" id="toggleNewPassword"
                                class="absolute right-4 top-1/2 -translate-y-1/2 text-cyan-800 hover:text-cyan-900 focus:outline-none">
                                <!-- Eye Off Icon -->
                                <svg id="eyeOffIcon1" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M13.875 18.825A10.05 10.05 0 0112 19c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24M1 1l22 22" />
                                </svg>
                            </button>
                        </div>

                        <!-- Password Strength Bar -->
                        <div class="flex items-center justify-between mt-3">
                            <div class="flex space-x-1.5 w-3/4">
                                <div id="bar1" class="h-1.5 w-1/4 rounded-full bg-[#8C6D3B]"></div>
                                <div id="bar2" class="h-1.5 w-1/4 rounded-full bg-[#8C6D3B]"></div>
                                <div id="bar3" class="h-1.5 w-1/4 rounded-full bg-[#8C6D3B]"></div>
                                <div id="bar4" class="h-1.5 w-1/4 rounded-full bg-[#15803D]"></div>
                            </div>
                            <span id="strengthText" class="text-xs font-semibold text-[#15803D]">Strong</span>
                        </div>
                    </div>

                    <!-- Confirm Password Input Group -->
                    <div>
                        <label for="confirmPassword" class="block text-sm font-semibold text-[#1E293B] mb-2">Confirm
                            Password</label>
                        <div class="relative">
                            <input type="password" id="confirmPassword" value="............"
                                class="w-full px-4 py-3 text-slate-700 bg-white border border-slate-400 rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-600 focus:border-transparent tracking-widest text-lg transition-all"
                                required>
                            <button type="button" id="toggleConfirmPassword"
                                class="absolute right-4 top-1/2 -translate-y-1/2 text-cyan-800 hover:text-cyan-900 focus:outline-none">
                                <svg id="eyeOffIcon2" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M13.875 18.825A10.05 10.05 0 0112 19c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24M1 1l22 22" />
                                </svg>
                            </button>
                        </div>

                        <!-- Password Match Indicator -->
                        <div id="matchStatus" class="flex items-center space-x-2 mt-2 text-[#15803D]">
                            <svg class="w-4 h-4 stroke-[3]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="9" stroke-width="2"></circle>
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4"></path>
                            </svg>
                            <span class="text-xs font-semibold">Passwords match</span>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button onclick="window.location.href='password-updated.html'" type="button" id="resetBtn"
                        class="w-full py-3.5 px-4 bg-[#233B6E] hover:bg-[#1A2E56] text-white font-semibold rounded-xl shadow-md transition-colors duration-200 mt-2">
                        Reset Password
                    </button>
                </form>
            </div>

            <!-- Watermark Footer -->
            <div class="flex items-center justify-center space-x-2 text-slate-400 text-xs py-4">
                <svg class="w-5 h-6 text-slate-300" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-5.45 9-12V5l-9-4z" />
                </svg>
                <span>Secure verification by Verified Doc</span>
            </div>

        </div>

    </div>

    <!-- Interactive JavaScript -->
    <script>
        // Password visibility toggle logic
        function setupTogglePassword(inputId, buttonId) {
            const input = document.getElementById(inputId);
            const btn = document.getElementById(buttonId);

            btn.addEventListener('click', () => {
                const isPassword = input.type === 'password';
                input.type = isPassword ? 'text' : 'password';
            });
        }

        setupTogglePassword('newPassword', 'toggleNewPassword');
        setupTogglePassword('confirmPassword', 'toggleConfirmPassword');

        // Dynamic Password Match & Strength Checks
        const newPassInput = document.getElementById('newPassword');
        const confirmPassInput = document.getElementById('confirmPassword');
        const matchStatus = document.getElementById('matchStatus');

        function checkMatch() {
            if (newPassInput.value && newPassInput.value === confirmPassInput.value) {
                matchStatus.style.display = 'flex';
            } else {
                matchStatus.style.display = 'none';
            }
        }

        newPassInput.addEventListener('input', checkMatch);
        confirmPassInput.addEventListener('input', checkMatch);

        // Back button event
        document.getElementById('backBtn').addEventListener('click', () => {
            window.history.back();
        });
    </script>
</body>

</html>
